# Project metadata and tool configuration.
#
# Runtime dependencies deliberately live in requirements.txt, not here. Two
# copies of a dependency list drift; requirements.txt is the one the README,
# the CI workflow and a reader all install from, so it is the single source.

[project]
name = "swish"
version = "1.0.0"
description = "Walk-forward validated NBA next-game outcome predictor with calibrated probabilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
