[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swish"
version = "1.0.0"
description = "Walk-forward validated NBA next-game outcome predictor with calibrated probabilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "playwright",
    "beautifulsoup4",
    "lxml",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "flake8"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
